<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Voyage Control</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../assets/images/voyage_logo.png">
        <link rel="stylesheet" href="../assets/css/voyage_style.css">
        <link rel="preload" href="../assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    </head>
    <body>
        <div class="section">
            <div class="voyage-container">
                <div class="header-section">
                    <div class="header-logo">
                        <img src="../assets/images/logo container.png" alt="logo">
                    </div>
                    <div class="header-content">
                        <div class="main-street-content">
                            <div class="main-street-img">
                                <img src="../assets/images/main_street_logo.png" alt="main street">
                            </div>
                            <div class="main-street-text">
                                <h1 class="text-600">
                                    Main Street Tower - USA
                                </h1>
                            </div>
                            <div class="main-street-arrow-img">
                                <img src="../assets/images/Arrow Chevron Down.png" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="header-profile-section">
                        <div class="alert-question-img">
                            <img src="../assets/images/Circle Actions Alert Question.png" alt="alert question">
                        </div>
                        <div class="notification-section">
                            <div class="notification-number text-600">
                                2
                            </div>
                            <div class="notification-img">
                                <img src="../assets/images/Alarm Bell.png" alt="notification">
                            </div>
                        </div>
                        <div class="profile-img">
                            <img src="../assets/images/Account.png" alt="profile">
                            <div class="profile-dropdown">
                                <div class="profile-dropdown-content">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="middle-section">
                    <div class="sidebar">
                        <div class="booking-section">
                            <div class="plus-img">
                                <img src="../assets/images/Actions Plus.png" alt="plus">
                            </div>
                            <div class="new-booking-content text-600">
                                New Booking
                            </div>
                        </div>
                        <div class="sidebar-list">
                            <!-- Booking list -->
                            <div class="sidebar-menu-list">
                                <div class="sidebar-menu-list-img">
                                    <img src="../assets/images/Card Collection.png" alt="booking list">
                                </div>
                                <div class="sidebar-menu-list-content text-600">
                                    Booking List
                                </div>
                            </div>

                            <!-- Calendar -->
                            <div class="sidebar-menu-list">
                                <div class="sidebar-menu-list-img">
                                    <img src="../assets/images/Calandar.png" alt="Calendar">
                                </div>
                                <div class="sidebar-menu-list-content text-600">
                                    Calendar
                                </div>
                            </div>

                            <!-- User Management -->
                            <div class="sidebar-menu-list">
                                <div class="sidebar-menu-list-img">
                                    <img src="../assets/images/Two People.png" alt="User Management">
                                </div>
                                <div class="sidebar-menu-list-content text-600">
                                    User Management
                                </div>
                            </div>

                            <!-- Project Management -->
                            <div class="sidebar-menu-list">
                                <div class="sidebar-menu-list-img">
                                    <img src="../assets/images/Configure.png" alt="Project Management">
                                </div>
                                <div class="sidebar-menu-list-content text-600">
                                    Project Management
                                </div>
                            </div>

                            <!-- Site Details -->
                            <div class="site-details-and-availability">
                                <div class="sidebar-menu-list">
                                    <div class="sidebar-menu-list-img">
                                        <img src="../assets/images/Planet Earth.png" alt="Site Details">
                                    </div>
                                    <div class="sidebar-menu-list-content text-600">
                                        Site Details
                                    </div>
                                </div>
                                <div class="sidebar-menu-list">
                                    <div class="sidebar-menu-list-img">
                                        <img src="../assets/images/Vector (Stroke).png" alt="Booking List">
                                    </div>
                                    <div class="sidebar-menu-list-content text-600">
                                        Availability
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="middle-content">
                        <div class="middle-content-container">
                            <div class="main-street-tower">
                                <div class="main-street-tower-logo-img">
                                    <img src="../assets/images/voyage_logo_bg.png" alt="main street tower logo">
                                </div>
                            </div>
                            <div class="main-street-tower-content">
                                <div class="main-street-tower-address">
                                    <div class="main-street-tower-address-location-img">
                                        <img src="../assets/images/Location.png" alt="location">
                                    </div>
                                    <div class="main-street-tower-address-content text-600">
                                        555 Main St.Township, CA 90001
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
